<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminal Memory</title>
  <link rel="stylesheet" href="ui/css/main.css">
</head>
<body>

  <!-- ============================================================
       BACKGROUND LAYER 1: Structural Wireframe Grid
  ============================================================ -->
  <div class="bg-grid">
    <!-- Row 1 (top strip) -->
    <div class="bg-grid__cell">
      <span class="wire-tag wire-tag--bl">[ .NODE ]</span>
    </div>
    <div class="bg-grid__cell">
      <span class="wire-tag wire-tag--tl">[ 200 OK ]</span>
      <!-- Orange accent star -->
      <span class="grid-star" style="top:14px; right:30%;">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/></svg>
      </span>
    </div>
    <div class="bg-grid__cell">
      <span class="wire-tag wire-tag--tr">[ RECALL ]</span>
    </div>

    <!-- Row 2 (main workspace) -->
    <div class="bg-grid__cell">
      <span class="wire-tag wire-tag--tl">[ BM25 ]</span>
      <!-- Dot matrix icon -->
      <div class="dot-matrix" style="bottom:12px; left:12px;">
        <div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div>
        <div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div>
        <div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div>
      </div>
    </div>
    <div class="bg-grid__cell bg-grid__cell--center">
      <!-- Dense sub-grid (12x6) -->
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
      <div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div><div class="bg-grid__sub-cell"></div>
    </div>
    <div class="bg-grid__cell">
      <span class="wire-tag wire-tag--tr">[ BLOOM ]</span>
      <!-- Orange accent star -->
      <span class="grid-star" style="bottom:20px; left:15px;">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/></svg>
      </span>
      <!-- Dot matrix icon -->
      <div class="dot-matrix" style="top:14px; right:12px;">
        <div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div>
        <div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div>
        <div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div><div class="dot-matrix__dot"></div>
      </div>
    </div>

    <!-- Row 3 (bottom strip) -->
    <div class="bg-grid__cell">
      <span class="wire-tag wire-tag--tl">[ .JSON ]</span>
    </div>
    <div class="bg-grid__cell"></div>
    <div class="bg-grid__cell">
      <span class="wire-tag wire-tag--br">[ TF-IDF ]</span>
    </div>
  </div>

  <!-- Footer Wireframe Strip (schematic labels) -->
  <div class="bg-grid__footer">
    <div class="bg-grid__footer-cell"></div>
    <div class="bg-grid__footer-cell"><span class="footer-label">Logo</span></div>
    <div class="bg-grid__footer-cell"><span class="footer-label">Navigation</span></div>
    <div class="bg-grid__footer-cell"><div class="footer-block footer-block--accent"></div></div>
    <div class="bg-grid__footer-cell"><div class="footer-block"></div></div>
    <div class="bg-grid__footer-cell"><span class="footer-label">.JSON</span></div>
  </div>

  <!-- ============================================================
       BACKGROUND LAYER 2: Animated Geometric Canvas
  ============================================================ -->
  <canvas class="geo-canvas" id="geo-canvas"></canvas>

  <!-- ============================================================
       APPLICATION LAYER
  ============================================================ -->
  <div class="app">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar__brand">
        <svg class="topbar__brand-icon" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M3 3H21V21H3V3ZM12 6L6 18H9.5L10.8 15H13.2L14.5 18H18L12 6ZM12 9.5L13 12.5H11L12 9.5Z"/>
        </svg>
        <span>LUMINAL</span>
        <span class="topbar__version">v1.0</span>
      </div>
      <div class="topbar__status">
        <span><span class="topbar__dot" id="status-dot"></span> <span id="status-label">IDLE</span></span>
        <span>Nodes: <strong id="stat-nodes">0</strong></span>
        <span>Window: <strong id="stat-window">0</strong></span>
        <span>Memory: <strong id="stat-memory">0 MB</strong></span>
      </div>
    </header>

    <!-- Main Body -->
    <div class="app__body">

      <!-- Toolbar -->
      <div class="toolbar">
        <button class="btn-control" id="btn-trim" title="Trim history before current window">✂ Trim</button>
        <button class="btn-control" id="btn-branch" title="Archive everything, start fresh">⌥ Branch</button>
        <span class="toolbar__divider"></span>
        <button class="btn-control" id="btn-search" title="Search conversation history">⌕ Search</button>
        <button class="btn-control" id="btn-inspect" title="Inspect memory state">◉ Inspect</button>
        <button class="btn-control" id="btn-status" title="System status">⊡ Status</button>
      </div>

      <!-- Chat Area -->
      <div class="app__chat-area">
        <div class="chat-stream" id="chat-stream">
          <!-- Messages render here -->
        </div>

        <!-- Input -->
        <div class="input-area">
          <div class="input-box">
            <textarea class="input-box__textarea" id="user-input" placeholder="Type a message..." rows="1"></textarea>
            <div class="input-box__actions">
              <div class="input-box__pills">
                <button class="pill-btn active" id="pill-auto">░ Auto</button>
                <button class="pill-btn" id="pill-recall">⠶ Recall</button>
                <button class="pill-btn" id="pill-deep">⣿ Deep</button>
              </div>
              <button class="btn-icon btn-icon--accent" id="send-btn" title="Send">→</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       MODALS
  ============================================================ -->

  <!-- Modal: Search -->
  <div class="modal-backdrop" id="modal-search-backdrop"></div>
  <div class="modal" id="modal-search">
    <div class="modal__header">
      <span class="modal__title">Search History</span>
      <button class="btn-icon btn-icon--ghost" id="modal-search-close">✕</button>
    </div>
    <div class="modal__body">
      <div style="margin-bottom: var(--space-12);">
        <input type="text" id="search-input" placeholder="Search your conversation history..."
          style="width:100%; padding:var(--space-10) var(--space-12); border:1px solid var(--color-border); border-radius:var(--radius-lg); font-size:var(--text-base);">
      </div>
      <div id="search-results" class="matrix-box" style="min-height:100px;">No results yet.</div>
    </div>
  </div>

  <!-- Modal: Inspect -->
  <div class="modal-backdrop" id="modal-inspect-backdrop"></div>
  <div class="modal" id="modal-inspect" style="max-width:720px;">
    <div class="modal__header">
      <span class="modal__title">Memory Inspector</span>
      <button class="btn-icon btn-icon--ghost" id="modal-inspect-close">✕</button>
    </div>
    <div class="modal__body">
      <div id="inspect-output" class="matrix-box" style="min-height:200px; max-height:60vh; overflow-y:auto;">Loading...</div>
    </div>
  </div>

  <!-- Modal: Status -->
  <div class="modal-backdrop" id="modal-status-backdrop"></div>
  <div class="modal" id="modal-status" style="max-width:480px;">
    <div class="modal__header">
      <span class="modal__title">System Status</span>
      <button class="btn-icon btn-icon--ghost" id="modal-status-close">✕</button>
    </div>
    <div class="modal__body" id="status-body">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS — Load order: library → canvas → components → app
  ============================================================ -->
  <script src="../dist/luminal-memory.umd.js"></script>
  <script type="module">
    // Load the test fixture as a module and expose as global
    import { conversation35 } from '../tests/fixtures/conversation-35.js';
    window.conversation35 = conversation35;
    window.dispatchEvent(new Event('fixture-ready'));
  </script>
  <script src="ui/js/canvas.js"></script>
  <script src="ui/js/components/modal.js"></script>
  <script src="ui/js/components/topbar.js"></script>
  <script src="ui/js/components/chat.js"></script>
  <script src="ui/js/components/input.js"></script>
  <script src="ui/js/components/toolbar.js"></script>
  <script src="ui/js/components/search-modal.js"></script>
  <script src="ui/js/components/inspect-modal.js"></script>
  <script src="ui/js/components/status-modal.js"></script>
  <script src="ui/js/app.js"></script>
</body>
</html>
